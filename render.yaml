services:
  - type: web
    name: newcondo-combined-backend
    runtime: node
    region: frankfurt          # oregon or frankfurt if your users are in Africa/Europe
    plan: free
    # DO NOT set rootDir here — we need repo root for pnpm workspace resolution
    # db:generate is explicit: when only schema.prisma changes, pnpm reports
    # "Already up to date" and skips @newcondo/db's postinstall, leaving a stale
    # Prisma client (every new model/field then "does not exist"). The "..."
    # suffix builds combined-backend's workspace deps (db, backend-shared,
    # payment-service …) first, in order.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @newcondo/db db:generate && pnpm --filter "@newcondo/combined-backend..." build
    startCommand: node backend/combined-backend/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # All secrets below — set these manually in dashboard, not here
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
    buildFilter:
      paths:
        - backend/**
        - packages/**      # shared packages like @newcondo/db, @newcondo/backend-shared
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
      ignoredPaths:
        - apps/**          # frontend changes don't trigger backend redeploy
        - docs/**
        - "**/*.md"